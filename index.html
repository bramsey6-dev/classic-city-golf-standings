<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Classic City Golf — Live Standings</title>
<meta name="theme-color" content="#0F3D2E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fairway: #0F3D2E;
    --fairway-dark: #0A2B20;
    --ivory: #F7F4EC;
    --card: #FFFFFF;
    --ink: #1C2620;
    --ink-soft: #5C6A61;
    --under-par: #C1432E;
    --even-par: #5C6A61;
    --over-par: #8B8378;
    --gold: #C9A24B;
    --line: #E4DFD1;
    --up-arrow: #2E7D4F;
    --down-arrow: #B03A2E;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fairway-dark);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  body {
    min-height: 100vh;
    padding-bottom: calc(72px + var(--safe-bottom));
  }

  .display {
    font-family: 'Oswald', 'Inter', sans-serif;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(180deg, var(--fairway) 0%, var(--fairway-dark) 100%);
    padding: 18px 20px 22px;
    color: var(--ivory);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 22px;
    margin: 0;
    line-height: 1.15;
  }

  .tournament-name {
    font-size: 13px;
    color: rgba(247,244,236,0.7);
    margin-top: 4px;
  }

  .refresh-btn {
    background: rgba(247,244,236,0.12);
    border: 1px solid rgba(247,244,236,0.25);
    color: var(--ivory);
    border-radius: 999px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .refresh-btn:active { transform: scale(0.92); background: rgba(247,244,236,0.22); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .updated-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: rgba(247,244,236,0.55);
    margin-top: 12px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ADE80;
    box-shadow: 0 0 0 0 rgba(74,222,128,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  /* ---------- Main content ---------- */
  main {
    padding: 16px 14px 20px;
    max-width: 640px;
    margin: 0 auto;
  }

  .status-banner {
    background: #FDECEA;
    border: 1px solid #F3C6BF;
    color: #8C2E1F;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
    line-height: 1.4;
  }
  .status-banner.show { display: block; }

  /* ---------- View toggle ---------- */
  .view-toggle {
    display: none;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Standings cards ---------- */
  .standings-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .standing-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 2px rgba(15,61,46,0.06);
    border: 1px solid var(--line);
  }
  .standing-card.leader {
    border-color: var(--gold);
    background: linear-gradient(135deg, #FFFDF7 0%, #FBF3E0 100%);
  }

  .standing-rank {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
  }
  .leader .standing-rank { color: var(--gold); }

  .standing-name {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
  }
  .standing-sub {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .standing-total {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--fairway);
    text-align: right;
  }
  .standing-total .unit {
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-soft);
    display: block;
    text-align: right;
    margin-top: -2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .movement {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
  }
  .movement svg { width: 10px; height: 10px; }
  .movement.up svg { fill: var(--up-arrow); }
  .movement.down svg { fill: var(--down-arrow); }

  /* ---------- Team detail (expandable) ---------- */
  .team-golfers {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    grid-column: 1 / -1;
  }
  .standing-card.expanded .team-golfers { display: block; }
  .golfer-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .golfer-chip {
    font-size: 11.5px;
    background: var(--ivory);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .golfer-chip .pts {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    color: var(--fairway);
  }

  /* ---------- Section labels ---------- */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ivory);
    opacity: 0.6;
    font-weight: 600;
    margin: 4px 2px 10px;
  }

  /* ---------- Leaderboard rows ---------- */
  .lb-table {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .lb-row {
    display: grid;
    grid-template-columns: 44px 1fr 52px 44px;
    align-items: center;
    padding: 10px 12px;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.mine { background: #FBF8EF; }

  .lb-pos {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
  }
  .lb-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lb-name .mine-tag {
    font-size: 9px;
    background: var(--gold);
    color: #fff;
    border-radius: 4px;
    padding: 1px 5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
  }
  .lb-score {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .lb-score.under { color: var(--under-par); }
  .lb-score.even { color: var(--even-par); }
  .lb-score.over { color: var(--over-par); }

  .lb-pts {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--fairway);
    text-align: right;
  }

  /* ---------- Bottom tab bar ---------- */
  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--fairway);
    display: flex;
    padding: 8px 12px calc(8px + var(--safe-bottom));
    z-index: 30;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: rgba(247,244,236,0.55);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .tab-btn.active {
    color: var(--ivory);
    background: rgba(247,244,236,0.1);
  }
  .tab-btn:active { transform: scale(0.97); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ivory);
    opacity: 0.6;
    font-size: 13.5px;
  }

  @media (prefers-reduced-motion: reduce) {
    .refresh-btn.spinning svg { animation: none; }
    .live-dot { animation: none; }
  }

  @media (min-width: 700px) {
    .lb-row { grid-template-columns: 50px 1fr 60px 50px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">Classic City Golf Pool</div>
      <h1 class="display">Live Standings</h1>
      <div class="tournament-name" id="tournamentName">Loading tournament…</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh scores">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
  </div>
  <div class="updated-row">
    <span class="live-dot"></span>
    <span id="lastUpdated">Loading data…</span>
  </div>
</header>

<main>
  <div class="status-banner" id="statusBanner"></div>

  <div class="view active" id="view-standings">
    <div class="section-label">Pool Standings</div>
    <div class="standings-list" id="standingsList">
      <div class="empty-state">Fetching standings…</div>
    </div>
  </div>

  <div class="view" id="view-leaderboard">
    <div class="section-label">Tournament Leaderboard</div>
    <div class="lb-table" id="leaderboardTable">
      <div class="empty-state">Fetching leaderboard…</div>
    </div>
  </div>
</main>

<nav class="tabbar">
  <button class="tab-btn active" data-view="standings">Standings</button>
  <button class="tab-btn" data-view="leaderboard">Leaderboard</button>
</nav>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
